name: Primary Data
description: Primary Data was a software-defined storage and data-virtualization startup best known for its
  DataSphere platform, a metadata engine that abstracted files across heterogeneous storage tiers (flash,
  disk, cloud) behind a single global namespace and moved data automatically by policy. Backed by Battery
  Ventures among other investors, the company ceased operations in 2017, with much of its team and technology
  continuing at Hammerspace. It was surfaced as a Battery Ventures portfolio company and added to the API
  Evangelist network as a stub for enrichment. As of this pass the company is defunct and primarydata.com is
  a parked domain (GoDaddy lander), so there is no live developer portal, documentation, or API surface to
  harvest.
